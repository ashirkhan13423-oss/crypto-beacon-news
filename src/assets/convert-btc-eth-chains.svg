<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 896" width="1536" height="896">
  <rect width="1536" height="896" fill="#0A0B0D" />
  <g transform="translate(768, 448)">
    <!-- Interlocking Chain Link 1 (Left - Representing Origin Blockchain) -->
    <rect x="-380" y="-120" width="360" height="240" rx="120" fill="none" stroke="#2563EB" stroke-width="36" />
    <!-- Interlocking Chain Link 2 (Right - Representing Destination Blockchain) -->
    <rect x="20" y="-120" width="360" height="240" rx="120" fill="none" stroke="#0F9D58" stroke-width="36" />
    
    <!-- Link Bridge Interlock Overlay to give woven depth -->
    <path d="M 20 -60 A 120 120 0 0 1 20 60" fill="none" stroke="#0F9D58" stroke-width="36" stroke-linecap="round" />
    
    <!-- Central connection node / conversion bridge indicator -->
    <circle cx="0" cy="0" r="44" fill="#0A0B0D" stroke="#FFFFFF" stroke-width="8" />
    <path d="M -16 -12 L 0 4 L 16 -12 M -16 12 L 0 -4 L 16 12" fill="none" stroke="#0F9D58" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

