<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 896" width="1536" height="896">
  <rect width="1536" height="896" fill="#0A0B0D" />
  <g transform="translate(768, 448)">
    <!-- Connection beam between Key and Network Node -->
    <line x1="-280" y1="0" x2="280" y2="0" stroke="#1F2937" stroke-width="12" stroke-linecap="round" />
    <line x1="-280" y1="0" x2="280" y2="0" stroke="#0F9D58" stroke-width="4" stroke-dasharray="16 16" />

    <!-- Left Side: Cryptographic Key Symbol -->
    <g transform="translate(-320, 0)">
      <!-- Outer glowing circle -->
      <circle cx="0" cy="0" r="160" fill="#111827" stroke="#2563EB" stroke-width="8" />
      <!-- Key shape -->
      <circle cx="-35" cy="0" r="45" fill="none" stroke="#0F9D58" stroke-width="16" />
      <path d="M 10 0 L 80 0 L 80 35 M 50 0 L 50 25" fill="none" stroke="#0F9D58" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Center Pulse / Handshake Indicator -->
    <circle cx="0" cy="0" r="28" fill="#1F2937" stroke="#0F9D58" stroke-width="6" />
    <circle cx="0" cy="0" r="12" fill="#2563EB" />

    <!-- Right Side: Decentralized Network Node -->
    <g transform="translate(320, 0)">
      <circle cx="0" cy="0" r="160" fill="#111827" stroke="#0F9D58" stroke-width="8" />
      <!-- Internal Node Mesh -->
      <line x1="-50" y1="-50" x2="50" y2="-50" stroke="#2563EB" stroke-width="8" />
      <line x1="50" y1="-50" x2="60" y2="50" stroke="#2563EB" stroke-width="8" />
      <line x1="60" y1="50" x2="-40" y2="60" stroke="#2563EB" stroke-width="8" />
      <line x1="-40" y1="60" x2="-50" y2="-50" stroke="#2563EB" stroke-width="8" />
      <line x1="-50" y1="-50" x2="60" y2="50" stroke="#64748B" stroke-width="4" />
      <line x1="50" y1="-50" x2="-40" y2="60" stroke="#64748B" stroke-width="4" />

      <circle cx="-50" cy="-50" r="18" fill="#0F9D58" />
      <circle cx="50" cy="-50" r="18" fill="#0F9D58" />
      <circle cx="60" cy="50" r="18" fill="#0F9D58" />
      <circle cx="-40" cy="60" r="18" fill="#0F9D58" />
      <circle cx="0" cy="0" r="22" fill="#2563EB" />
    </g>
  </g>
</svg>

